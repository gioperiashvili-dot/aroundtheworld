    <style>
      .initial-page-loader {
        --loader-cycle: 950ms;
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 18%, rgba(246, 196, 69, 0.18), transparent 21rem),
          radial-gradient(circle at 18% 78%, rgba(50, 211, 196, 0.13), transparent 26rem),
          radial-gradient(circle at 88% 34%, rgba(246, 196, 69, 0.08), transparent 22rem),
          linear-gradient(135deg, #020812 0%, #061826 48%, #08231f 100%);
        color: #f8fbf9;
        font-family: "Manrope", "Segoe UI", Arial, sans-serif;
      }

      .initial-page-loader::before,
      .initial-page-loader::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .initial-page-loader::before {
        background:
          linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
        background-size: 72px 72px;
        -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.7), transparent 72%);
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.7), transparent 72%);
        opacity: 0.3;
      }

      .initial-page-loader::after {
        background:
          radial-gradient(circle at 50% 48%, transparent 0, transparent 28%, rgba(2, 8, 18, 0.48) 82%),
          linear-gradient(180deg, rgba(2, 8, 18, 0.18), rgba(2, 8, 18, 0.4));
      }

      .initial-page-loader__panel {
        position: relative;
        z-index: 1;
        display: grid;
        width: min(86vw, 26rem);
        gap: 1rem;
        place-items: center;
        padding: 2rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 1.5rem;
        background:
          radial-gradient(circle at 50% 0%, rgba(246, 196, 69, 0.12), transparent 13rem),
          linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.025)),
          rgba(8, 31, 38, 0.58);
        box-shadow:
          0 34px 120px -58px rgba(0, 0, 0, 0.98),
          0 0 42px rgba(246, 196, 69, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
      }

      .initial-page-loader__flightpath {
        --loader-track: min(72vw, 20rem);
        --loader-travel: calc(var(--loader-track) + 4.5rem);
        --loader-midpoint: min(39vw, 10.8rem);
        position: relative;
        width: var(--loader-track);
        height: 3.5rem;
        overflow: hidden;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .initial-page-loader__trail,
      .initial-page-loader__plane {
        position: absolute;
        left: 0;
        top: 50%;
        will-change: transform, opacity;
      }

      .initial-page-loader__trail {
        width: 9rem;
        height: 1px;
        background: linear-gradient(90deg, rgba(246, 196, 69, 0), rgba(246, 196, 69, 0.78));
        box-shadow: 0 0 18px rgba(246, 196, 69, 0.32), 0 0 28px rgba(50, 211, 196, 0.1);
        transform: translate3d(-10rem, -50%, 0);
        animation: initialPageLoaderTrail var(--loader-cycle) cubic-bezier(0.45, 0, 0.2, 1)
          infinite;
      }

      .initial-page-loader__plane {
        width: 3rem;
        color: #ffd76a;
        filter: drop-shadow(0 0 16px rgba(246, 196, 69, 0.38));
        transform: translate3d(-4rem, -50%, 0);
        animation: initialPageLoaderFlight var(--loader-cycle) cubic-bezier(0.45, 0, 0.2, 1)
          infinite;
      }

      .initial-page-loader__plane svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .initial-page-loader__brand {
        position: relative;
        margin: 0;
        min-height: 2.25rem;
        color: rgba(248, 251, 249, 0.96);
        font-size: clamp(1.45rem, 6vw, 2.05rem);
        font-weight: 800;
        letter-spacing: 0.1em;
      }

      .initial-page-loader__brand-text {
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        clip-path: inset(0 100% 0 0);
        animation: initialPageLoaderType var(--loader-cycle) steps(11, end) infinite;
      }

      .initial-page-loader__brand::after {
        content: "";
        display: inline-block;
        width: 2px;
        height: 1.05em;
        margin-left: 0.3rem;
        transform: translateY(0.18em);
        background: #ffd76a;
        box-shadow: 0 0 14px rgba(246, 196, 69, 0.42);
        animation: initialPageLoaderCursor 760ms steps(1, end) infinite;
      }

      @keyframes initialPageLoaderFlight {
        0% {
          opacity: 0;
          transform: translate3d(-4rem, -50%, 0) rotate(-3deg) scale(0.94);
        }

        12%,
        74% {
          opacity: 1;
        }

        52% {
          transform: translate3d(var(--loader-midpoint), -58%, 0) rotate(2deg) scale(1);
        }

        100% {
          opacity: 0;
          transform: translate3d(var(--loader-travel), -50%, 0) rotate(0deg) scale(1);
        }
      }

      @keyframes initialPageLoaderTrail {
        0% {
          opacity: 0;
          transform: translate3d(-10rem, -50%, 0);
        }

        18%,
        68% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          transform: translate3d(calc(var(--loader-travel) - 7.2rem), -50%, 0);
        }
      }

      @keyframes initialPageLoaderType {
        0%,
        12% {
          clip-path: inset(0 100% 0 0);
        }

        72%,
        100% {
          clip-path: inset(0 0 0 0);
        }
      }

      @keyframes initialPageLoaderCursor {
        0%,
        49% {
          opacity: 1;
        }

        50%,
        100% {
          opacity: 0.18;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-page-loader__trail,
        .initial-page-loader__plane,
        .initial-page-loader__brand-text,
        .initial-page-loader__brand::after {
          animation: none;
        }

        .initial-page-loader__trail {
          display: none;
        }

        .initial-page-loader__plane {
          opacity: 1;
          transform: translate3d(min(34vw, 9rem), -50%, 0);
        }

        .initial-page-loader__brand-text {
          clip-path: inset(0 0 0 0);
        }
      }
    </style>
